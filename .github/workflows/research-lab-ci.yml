name: research-lab-ci

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: pip

      - name: Install CPU-only test dependencies
        run: python -m pip install pytest==8.4.2

      - name: Syntax-check research code
        run: python -m compileall -q scripts src/qwen_distill

      - name: Run reproducibility control tests
        run: python -m pytest -q tests/test_research_reproducibility_controls.py tests/test_research_lab.py

      - name: Run free pre-GPU lab gate
        run: python scripts/lab_preflight.py --json
