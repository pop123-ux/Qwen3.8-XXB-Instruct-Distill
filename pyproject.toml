[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-distill"
version = "0.1.0"
description = "Research infrastructure for distilling Qwen3.8-27B into a 16 GB-deployable instruct model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pop Alexandru" }]
keywords = ["llm", "distillation", "qwen", "quantization", "long-context", "gated-deltanet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
inspect = ["huggingface_hub>=0.26"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/pop123-ux/Qwen3.8-XXB-Instruct-Distill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
