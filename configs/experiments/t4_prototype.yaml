# Experiment T4-D — Hybrid architecture prototype (Level 1 on the development ladder).
#
# Purpose: verify that the Qwen3.8-style hybrid architecture trains at all — shapes,
# cache/recurrent-state behaviour, generation, checkpoint save/load. It is NOT intended
# to produce a useful model, and the loss it reaches means nothing.
#
# Runs on a free Colab T4 in minutes.

name: t4_prototype
level: "Level 1 — T4 toy model"
description: >-
  Tiny hybrid DeltaNet/attention model on synthetic data. Validates the training
  mechanism end to end: forward, backward, optimizer, checkpointing, resume, logging.

model:
  # Inline architecture: a 4-layer hybrid with the teacher's 3:1 layout, scaled down.
  architecture:
    hidden_size: 256
    num_hidden_layers: 4
    intermediate_size: 704
    vocab_size: 4096
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 64
    linear_num_key_heads: 2
    linear_num_value_heads: 6
    linear_key_head_dim: 32
    linear_value_head_dim: 32
    full_attention_interval: 4
    max_position_embeddings: 2048
    tie_word_embeddings: true

data:
  synthetic: true
  synthetic_examples: 512
  max_sequence_length: 256

training:
  strategy: full          # the model is tiny; full training is the honest test
  optimizer: adamw
  precision: fp16         # T4 is Turing (7.5): NO bf16 support
  objective: sft
  learning_rate: 0.0003
  max_steps: 200
  warmup_steps: 20
  batch_size: 4
  gradient_accumulation_steps: 2
  gradient_checkpointing: false   # unnecessary at this scale
  seed: 0
  eval_every: 50
  save_every: 100
  log_every: 10

runtime:
  output_dir: experiments/runs/t4_prototype
  device: auto
  reserved_vram_gib: 1.0
