# Qwen3.8-27B teacher configuration.
#
# PROVENANCE WARNING: these values are the publicly reported configuration,
# corroborated across multiple secondary sources and shown to be self-consistent
# (they reproduce 26.90B parameters against the reference implementation's shape
# formulas, within 0.4% of the advertised 27B).
#
# They have NOT been read from the upstream config.json - see docs/VERIFICATION.md.
# Replace this file with the output of:
#     python scripts/inspect_teacher.py --repo-id Qwen/Qwen3.8-27B --config-only \
#         --save-spec configs/teacher/qwen3_8_27b.verified.json
# before making any architecture decision that depends on it.

name: Qwen3.8-27B
repo_id: Qwen/Qwen3.8-27B
verified: false
verification_notes: >-
  Structural formulas verified against transformers==5.15.1 models/qwen3_5.
  Config values corroborated by secondary sources only; huggingface.co was
  unreachable from the authoring environment.

architecture:
  hidden_size: 5120
  num_hidden_layers: 64
  intermediate_size: 17408
  vocab_size: 248320
  tie_word_embeddings: false

  num_attention_heads: 24
  num_key_value_heads: 4
  head_dim: 256
  partial_rotary_factor: 0.25      # -> rope dim 64
  attention_bias: false

  linear_num_value_heads: 48
  linear_num_key_heads: 16
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_conv_kernel_dim: 4

  full_attention_interval: 4        # -> 48 linear : 16 full
  max_position_embeddings: 262144

derived:
  total_parameters: 26895998464     # 26.90B, computed by qwen_distill.architecture.params
  mlp_share: 0.636
  num_linear_attention_layers: 48
  num_full_attention_layers: 16

capabilities:
  multimodal: true                  # CORROBORATED; vision_config present in the qwen3_5 family
  mtp_head: true                    # VERIFIED (family): mtp.* keys ship; transformers discards them
  reasoning_effort_levels: [low, medium, xhigh]     # CORROBORATED
  reasoning_effort_default: xhigh                   # CORROBORATED
  # Reported that `medium` injects no instruction and is effectively a no-op.
  # UNKNOWN, but mechanically decidable:
  #   python scripts/benchmark_reasoning.py --model Qwen/Qwen3.8-27B --template-only
  medium_reported_noop: true

# Phase 1 verification status per field group. See docs/VERIFICATION.md for evidence.
verification_status:
  parameter_formulas: VERIFIED      # exact match vs transformers meta-device build (delta 0)
  cache_and_state_shapes: VERIFIED  # exact match vs a real forward pass
  layer_layout_rule: VERIFIED       # 48 linear / 16 full at interval 4
  attention_and_deltanet_dims: VERIFIED   # for the qwen3_5 family
  mtp_representation: VERIFIED      # vLLM _SPECULATIVE_DECODING_MODELS; 424.70M params (1.58%)
  config_values_for_3_8: UNKNOWN    # huggingface.co blocked; config.json never read
  model_type_for_3_8: UNKNOWN       # leading hypothesis: qwen3_5 (see docs/VERIFICATION.md)
  tokenizer: UNKNOWN
  chat_template: UNKNOWN
  license: UNKNOWN                  # MUST be read before any release
  peak_vram_end_to_end: UNKNOWN     # no GPU available; runtime overhead uncalibrated

derived_mtp:
  parameters: 424699392             # VERIFIED formula; 1.58% of 26.90B
  layers_default: 1                 # vllm: getattr(config, "mtp_num_hidden_layers", 1)
  layer_type: full_attention        # MTP layers are never DeltaNet
  shares_embed_and_lm_head: true    # not duplicated in the draft model

license:
  reported: Apache-2.0
  verified: false                   # MUST be confirmed before any release
