      to bridge width/depth mismatch. Already effectively represented by the pointwise control, though
      without the learned projection.
  conclusion: No canonical "FDD prediction-delta" distillation method was identified. Building one from
    the name alone would produce a strawman. The intended paper must be named before this comparator can
    be implemented faithfully.
  question_for_user: Which specific paper does "FDD" refer to? A title, arXiv id or author would unblock
    it.
