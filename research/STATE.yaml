      lambda_magnitude: 1.0
      eps: 1.0e-06
      direction_weight: 1.0
      student_term: d_s = h_s[l+1] - h_s[l]
      teacher_term: d_t = h_t[b] - h_t[a], [a,b) assigned teacher span, tiling 64/64
      locked_before_training: true
      preregistration_sha256: fb9baa27645e3e4e6fa07e89f94b3fc04bfbe10f0bbcbed93d3dde09e3c9dec5
      implementation: in-process patch of qwen_distill.distillation.behavioral._pair_term; repository
        objective code unmodified
    exact_changed_variable: 'behavioral loss formulation only: ADDED log-RMS magnitude term S vs Run004-M;
      all frozen assets/defaults identical'
    analytical_basis: 'Under RMS normalisation MSE == 2*(1-cos) identically, so Run004-M reduced to 3*(1-cos):
      pure direction, ZERO update-magnitude information. Verified numerically: Run003 mag/dir=2.0000,
      Run004-M mag/dir=2.0000. Empirical check: a teacher delta scaled 3x gives magnitude=0.000000 and
      direction=0.000000 under the old objective, while S = 1.206947 = log(3)^2.'
