      objective: behavioral_kd
      behavioral_mode: delta
      scale_aware: true
      equation: L = mean_pairs[ MSE(RMSnorm(d_s), RMSnorm(d_t)) + 1.0*(1 - cos(RMSnorm(d_s), RMSnorm(d_t)))
