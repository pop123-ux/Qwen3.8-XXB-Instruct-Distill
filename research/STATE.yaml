current_finding:
  statement: 'Across three transformation-matching formulations under one matched 128-step envelope: A
    (RMS-normalised delta) loses badly (+2.93 validation); B (normalised + explicit log-RMS magnitude
    term) nearly closes the gap (+0.17); C (raw unnormalised delta) BEATS the pointwise control (-1.21
    validation, -1.38 CE, -0.62 logit KD), trailing only slightly on top-1 agreement (-0.018).'
  analytical_root_cause: 'Under RMS normalisation MSE == 2*(1-cos) identically, so Arm A reduced algebraically
    to 3*(1-cos): pure direction, ZERO update-magnitude information. Empirically a teacher delta scaled
    3x yields magnitude=0.000000 and direction=0.000000 under that objective. Verified mag/dir == 2.0000
    in both Run003 and Run004-M logs.'
  mechanism_caveat: 'IMPORTANT: the win is NOT explained by driving student update magnitudes toward the
    teacher. Arm B achieved the closest magnitude parity (final layer_norm_ratio 0.935) yet performed
    WORSE than Arm C, whose final norm_ratio is 0.416 - further from parity than the control (0.617).
    The distinguishing factor is that the loss retains magnitude SENSITIVITY, not that magnitudes are
    equalised. The precise mechanism is NOT established by these runs and must not be asserted.'
  implication: Run004-M was a formulation-specific negative, not a refutation of transformation matching.
    RQ1 now has one behavioral formulation (raw residual matching) that beats matched pointwise KD on
    held-out loss at 128 steps for this topology. Persistence, replication, and a second topology remain
    unmet.
  persistence: 'Arm C persistence CONFIRMED at 1024 steps: 7.7461 -> 6.6116 final validation within the
    same formulation, mean top-1 agreement 0.0970 -> 0.1516, healthy optimization throughout. Plateau
    after ~step 768.'
  seed1_replication: The raw-delta advantage on validation loss and CE REPLICATED at seed 1 against a
    same-seed, same-environment pointwise control (val -15.20%, CE -13.41%), as did the small top-1 agreement
    disadvantage. The seed-0 logit-KD advantage did not replicate.
  span_abstraction: The span-aggregation abstraction is NOT supported as the mechanism. Structurally it
    is active on only 4/48 supervised pairs, and empirically replacing spans with adjacent anchor layers
    did not degrade results (7.198 vs 7.411 validation, adjacent nominally better). The raw-delta advantage
    over pointwise should be attributed to retaining update-magnitude information, not to charging removed
    teacher layers to student spans.
  normalization_ablation: 'Enabling normalization on the raw residual-delta objective (single-flag ablation
    of run008) moved final validation 7.411 -> 10.822 (+46.0%), erasing the advantage and falling below
    the pointwise control. MAGNITUDE HYPOTHESIS SUPPORTED: preserving representation-update magnitude
    is the operative factor. Not yet separated from loss-scale/effective-LR effects.'
  ce_only_floor: 'CE-only no-teacher training reaches 4.3189 final validation vs 7.1981 for the best pure-KD
    arm (+66.7%). All pure representation-matching arms are far below the no-teacher floor on held-out
    CE. CAVEAT: validation loss is exactly the CE-only training objective and the KD arms never optimise
    CE, so this bounds the claim rather than refuting teacher signal outright. The composite objective
    is now the decisive experiment.'
  composite_matrix: The headline preregistered comparison is now run. A3 (CE+logitKD+raw residual-transition)
    is slightly WORSE than A2 (CE+logitKD) at 4.9365 vs 4.8960, and worse than A1 pointwise at 4.8533.
    Raw residual-transition supervision does not add value to the realistic recipe at this budget. Claims
    that it improves language modelling are NOT supported.
