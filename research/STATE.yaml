      spans. The span abstraction is therefore active on only 8.3% of supervised pairs; for the other
      91.7% the span target IS the adjacent target.
    artifact: experiments/_session_2026-09-11/span_structure_analysis.json
  classification: ABSTRACTION_CLAIM_NOT_SUPPORTED
  interpretation: Replacing the full assigned teacher span with the single adjacent anchor layer did NOT
    hurt; adjacent was nominally better by 0.213 validation (-2.88%). Combined with the structural fact
