    raw/unnormalised treatment, which preserves update-magnitude information (under RMS normalisation
    MSE == 2*(1-cos) identically, making the normalised objective pure-direction).
  honest_limits:
  - Single seed for this ablation; -0.213 is small and no variance estimate exists, so the defensible
    reading is that span and adjacent are INDISTINGUISHABLE at this budget, not that adjacent is genuinely
    better.
