gradient_scale_control_result:
  classification: NORMALISATION_PENALTY_NOT_EXPLAINED_BY_SCALE
  finding: Matching the normalised objective's initial trainable gradient scale to the raw objective (multiplier
    2.681121) moved final validation 10.82203 -> 10.43334, recovering 11.4% of the 3.41072 Run011-Run008
    gap. The normalisation penalty is not explained by a simple scalar gradient-scale mismatch.
  limits:
  - 'Clip-mediated only: training applies clip_grad_norm_(1.0) then AdamW, which is ~invariant to a constant
    gradient rescale. Calibration found the raw gradient above the clip threshold on 4/4 samples and the
    normalised on 3/4, so the multiplier acts mainly through the clip nonlinearity. This rules out a clip-mediated
    scalar-scale explanation, NOT every optimisation-dynamics explanation (e.g. per-parameter gradient
    geometry, or scale that varies across training).'
  - The 0.389 improvement over Run011 is ~1.8x the 0.213 single-spread noise floor, so the multiplier
    may have had a small real effect; one run cannot establish that.
  - Single seed, 128 steps, single topology, pure hidden-matching probe (not a preregistered composite
    cell).
  - Top-1 agreement is not moved (0.1166 vs Run011 0.1153).
  reading_of_run011: The magnitude-information interpretation of Run011 survives this control; it is not
    established as the mechanism, since optimisation explanations other than a scalar clip-mediated scale
    remain open.
