normalization_ablation_result:
  decisive_pair: run008 raw residual-delta vs run011 normalized residual-delta (argv-identical except
    one flag)
  seed1_same_environment_final_validation:
    run009_pointwise_normalized: 8.73926
    run011_residual_delta_normalized: 10.82203
    run008_residual_delta_raw: 7.41131
    run010_adjacent_delta_raw: 7.19814
  effect_of_enabling_normalization_on_delta:
    delta_validation: 3.41072
    pct: 46.02
    delta_ce: 3.27045
    delta_top1: -0.00849
  classification: MAGNITUDE_HYPOTHESIS_SUPPORTED
  classification_basis: Enabling normalization on an otherwise byte-identical configuration moved final
    validation from 7.41131 to 10.82203 (+3.411, +46.0%). This not only erased the entire -1.328 advantage
    over the pointwise control, it pushed the arm 2.083 BELOW that control. The effect is an order of
    magnitude larger than the run010-vs-run008 spread (0.213) that was preregistered as the noise floor,
    so it is not attributable to seed noise.
  mechanistic_reading: Under RMS normalization the per-pair magnitude term is algebraically redundant
    (MSE == 2*(1-cos); observed ratio 1.999976), so the normalized objective is direction-only. Removing
    update-magnitude information is therefore sufficient to destroy the raw-delta advantage. Combined
    with run010 (span aggregation contributes nothing), the evidence points to preservation of representation-update
    MAGNITUDE as the operative factor, not the transition/delta form itself and not span abstraction.
  important_nuance: Normalized delta is not merely equal to pointwise - it is clearly WORSE (+2.083).
    Both are direction-only objectives, so the delta form appears actively harmful once magnitude is stripped.
    This reproduces historical Run004-M at seed 0 (11.8886 vs Run003 8.9599), so the pattern now holds
    at two seeds and two package environments.
  honest_limits:
  - Single seed for run011 itself; the supporting seed-0 evidence is historical Run004-M on a different
    package stack.
  - This identifies normalization as the causal lever but does not isolate WHY magnitude helps; loss-scale
    / effective-learning-rate effects are not ruled out and would need a scale-matched control.
  - Top-1 teacher agreement still favours the pointwise control in every arm; validation/CE and agreement
    continue to disagree.
  - Single teacher/student topology.
ce_only_floor_result:
  seed1_final_validation_all_arms:
    run012_ce_only_no_teacher: 4.31886
    run010_adjacent_delta_raw: 7.19814
    run008_residual_delta_raw: 7.41131
    run009_pointwise_normalized: 8.73926
    run011_residual_delta_normalized: 10.82203
  gap_vs_ce_only_floor:
    run010_adjacent_delta_raw: 2.8793
    run008_residual_delta_raw: 3.0924
    run009_pointwise_normalized: 4.4204
    run011_residual_delta_normalized: 6.5032
  classification: ALL_PURE_KD_ARMS_BELOW_NO_TEACHER_FLOOR
  headline: Every pure teacher-supervised arm is substantially WORSE on held-out validation loss than
    simply training the same student on the same data with cross-entropy. The best KD arm (adjacent raw
    residual-transition) is +2.879 (+66.7%) above the CE-only floor.
  critical_caveat_do_not_omit: 'Validation loss IS held-out cross-entropy, which is exactly the CE-only
    arm TRAINING objective. The KD arms as configured are PURE representation-matching: kd_run runs layer_kd
    with loss weight 1.0 and computes CE only as a no-gradient diagnostic, so they never optimise CE at
    all. This result therefore establishes that pure representation-matching WITHOUT any CE term is far
    worse at language modelling than direct CE training. It does NOT establish that teacher signal is
    worthless in a realistic KD recipe, and it must not be reported as such.'
  what_it_does_establish:
  - The intra-KD comparisons (raw vs normalized vs pointwise vs adjacent) remain internally valid, but
    the entire family sits below a trivially available no-teacher baseline on this metric.
  - 'Any claim of the form "raw residual-transition KD improves language modelling" is NOT supported at
    this budget: it improves only relative to other pure-KD objectives.'
  - The preregistered composite (CE + logit KD + raw residual-transition KD) is now the decisive remaining
    experiment, because it is the only configuration tested that is a realistic recipe.
  honest_limits:
  - Single seed.
  - 128 steps is a very short budget; CE-only may simply converge faster early while KD arms could catch
    up at longer horizons. No long-horizon CE-only control exists.
  - CE-only has no teacher-agreement metric, so the arms cannot be compared on imitation fidelity.
  - Single teacher/student topology.
